name: Update garde roster

on:
  schedule:
    - cron: '0 5 * * *' # every day at 05:00 UTC (= Abidjan time)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-garde
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pdftotext
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils

      - name: Fetch roster from unppci.org
        run: node scripts/fetch_garde.js --out garde.json --pdf-dir pdfs

      - name: Commit if changed
        run: |
          if git diff --quiet -- garde.json; then
            echo "No change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add garde.json
          git commit -m "Update garde roster ($(date -u +%Y-%m-%d))"
          git push
